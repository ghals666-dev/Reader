name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # 순수 로직 테스트. macOS 러너를 기다리지 않고 빠르게 돈다.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test core logic
        run: swift test

  # 전체 빌드, PDFKit·Vision 통합 테스트, 앱 묶음 생성
  macos:
    # 2026-11 현재 이 저장소에서는 arm64 macOS 러너가 배정되지 않아 인텔 러너를 쓴다.
    # 앱은 유니버설 바이너리로 만들기 때문에 애플 실리콘 맥에서도 그대로 돈다.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Reader
          path: |
            build/Reader.zip
            build/reader-cli

  # main에 합쳐질 때마다 앱을 Releases에 올린다. (Actions 아티팩트는 90일 뒤 사라진다.)
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Reader
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" dist/Reader.zip dist/reader-cli \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Reader 0.1.${{ github.run_number }}" \
            --notes "Reader.zip을 받아 압축을 풀고 Reader.app을 실행하세요. 처음 실행하는 방법은 README를 참고하세요."

