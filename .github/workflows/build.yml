name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # 순수 로직 테스트. macOS 러너를 기다리지 않고 빠르게 돈다.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test core logic
        run: swift test

  # 전체 빌드, PDFKit·Vision 통합 테스트, 앱 묶음 생성
  macos:
    # 2026-11 현재 이 저장소에서는 arm64 macOS 러너가 배정되지 않아 인텔 러너를 쓴다.
    # 앱은 유니버설 바이너리로 만들기 때문에 애플 실리콘 맥에서도 그대로 돈다.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Reader
          path: |
            build/Reader.zip
            build/reader-cli
