name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # 순수 로직 테스트. macOS 러너를 기다리지 않고 빠르게 돈다.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test core logic
        run: swift test

  # 전체 빌드, PDFKit·Vision 통합 테스트, 앱 묶음 생성
  macos:
    # 러너 종류에 따라 배정이 늦거나 지원이 끊기는 경우가 있어 여러 종류로 돌린다.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Reader-${{ matrix.os }}
          path: |
            build/Reader.zip
            build/reader-cli
