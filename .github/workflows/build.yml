name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # 순수 로직 테스트. macOS 러너를 기다리지 않고 빠르게 돈다.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test core logic
        run: swift test

  # 전체 빌드, PDFKit·Vision 통합 테스트, 앱 묶음 생성
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Reader
          path: |
            build/Reader.zip
            build/reader-cli
