name: video-grabber

on:
  push:
    branches: [main, "claude/**"]
    paths: ["VideoGrabber/**", ".github/workflows/video-grabber.yml"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: VideoGrabber/scripts/make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VideoGrabber
          path: VideoGrabber/build/VideoGrabber.zip
